  /api/v1/tools/edit_timeline: 
    post: 
      operationId: edit_timeline
      summary: "Edit an agent project with structured operations (atomic, all or nothing). ops: trim{element_id,in?,out?,ripple?} (source seconds) · cut{element_id,at} (timeline seconds) · ripple_delete{element_id} · add_clip{file,start?,in?,out?} · add_text{text,start,end} · set_volume{element_id,volume_db}. Get element ids from get_project. Pass expected_revision to avoid overwriting concurrent edits. The browser copy is replaced on next import at /agent?id=<project_id>."
      description: "Required scope: `editor`. Free."
      security: 
        - bearer: 
            []
      x-scope: editor
      x-billable: false
      x-gated: false
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                project_id: 
                  type: string
                  format: uuid
                  pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                operations: 
                  minItems: 1
                  maxItems: 100
                  type: array
                  items: 
                    oneOf: 
                      - type: object
                        properties: 
                          op: 
                            type: string
                            const: trim
                          element_id: 
                            type: string
                          in: 
                            description: new source in-point (s)
                            type: number
                            minimum: 0
                          out: 
                            description: new source out-point (s)
                            type: number
                            minimum: 0
                          ripple: 
                            description: shift later elements on the same track by the removed time
                            type: boolean
                        required: 
                          - op
                          - element_id
                        additionalProperties: false
                      - type: object
                        properties: 
                          op: 
                            type: string
                            const: cut
                          element_id: 
                            type: string
                          at: 
                            type: number
                            minimum: 0
                            description: timeline time (s) to split at
                        required: 
                          - op
                          - element_id
                          - at
                        additionalProperties: false
                      - type: object
                        properties: 
                          op: 
                            type: string
                            const: ripple_delete
                          element_id: 
                            type: string
                        required: 
                          - op
                          - element_id
                        additionalProperties: false
                      - type: object
                        properties: 
                          op: 
                            type: string
                            const: add_clip
                          file: 
                            type: string
                            pattern: "^[\\w.-]+$"
                            description: media-bin file name
                          start: 
                            description: "timeline start (s), default end of main track"
                            type: number
                            minimum: 0
                          in: 
                            type: number
                            minimum: 0
                          out: 
                            type: number
                            minimum: 0
                        required: 
                          - op
                          - file
                        additionalProperties: false
                      - type: object
                        properties: 
                          op: 
                            type: string
                            const: add_text
                          text: 
                            type: string
                            minLength: 1
                            maxLength: 500
                          start: 
                            type: number
                            minimum: 0
                          end: 
                            type: number
                            minimum: 0
                        required: 
                          - op
                          - text
                          - start
                          - end
                        additionalProperties: false
                      - type: object
                        properties: 
                          op: 
                            type: string
                            const: set_volume
                          element_id: 
                            type: string
                          volume_db: 
                            type: number
                            description: "dB, -60..20; 0 = unchanged"
                        required: 
                          - op
                          - element_id
                          - volume_db
                        additionalProperties: false
                expected_revision: 
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - project_id
                - operations
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
