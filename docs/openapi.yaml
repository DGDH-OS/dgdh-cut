openapi: 3.1.0
info: 
  title: DGDH CUT Agent API
  version: 2.0.0
  description: "Headless video tools for agents. Same tools are available over MCP at /api/mcp (Streamable HTTP). Auth: `Authorization: Bearer cut_live_…`."
servers: 
  - url: https://studio.dgdh-os.com
paths: 
  /api/v1/tools: 
    get: 
      operationId: listTools
      summary: Tools this key may call (with JSON Schemas)
      security: 
        - bearer: 
            []
      responses: 
        "200": 
          description: OK
        "401": 
          &401
          description: Error
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/Error"
        "429": 
          *401
  /api/v1/usage: 
    get: 
      operationId: usage
      summary: "Billable units + EUR per tool, per state (pending/accepted/voided) and this key's budget (default last 30 days)"
      security: 
        - bearer: 
            []
      parameters: 
        - name: since
          in: query
          schema: 
            type: string
            format: date-time
      responses: 
        "200": 
          description: OK
        "401": 
          *401
  "/api/v1/media/{file}": 
    get: 
      operationId: downloadMedia
      summary: Download a media-bin file (renders)
      security: 
        - bearer: 
            []
      parameters: 
        - name: file
          in: path
          required: true
          schema: 
            type: string
      responses: 
        "200": 
          description: Video bytes
        "401": 
          *401
        "404": 
          *401
  /api/agent/projects: 
    post: 
      operationId: putAgentProject
      summary: "Store an agent project (dgdh-cut-agent-project/v1) server-side; owned by the key's org. Bearer key (scope editor) or Suite session."
      security: 
        - bearer: 
            []
        - suiteSession: 
            []
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required: 
                - schema
                - project
                - media
              properties: 
                schema: 
                  const: dgdh-cut-agent-project/v1
                project: 
                  type: object
                media: 
                  type: array
                  items: 
                    type: object
      responses: 
        "200": 
          description: "{ok,id,revision,import}"
        "400": 
          *401
        "401": 
          *401
        "403": 
          *401
        "413": 
          *401
    get: 
      operationId: getAgentProjects
      summary: "List own projects, or one with ?id="
      security: 
        - bearer: 
            []
        - suiteSession: 
            []
      parameters: 
        - name: id
          in: query
          schema: 
            type: string
            format: uuid
      responses: 
        "200": 
          description: OK
        "401": 
          *401
        "404": 
          *401
  /api/v1/keys: 
    post: 
      operationId: createKey
      summary: Create an API key (Suite browser session required). Key is shown once.
      security: 
        - suiteSession: 
            []
      requestBody: 
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                name: 
                  type: string
                scopes: 
                  type: array
                  items: 
                    enum: 
                      - media:read
                      - media:write
                      - render
                      - transcribe
                      - voice
                      - editor
                      - publish
                rate_limit_per_min: 
                  type: integer
                  minimum: 1
                  maximum: 600
                budget_eur_month: 
                  type: 
                    - number
                    - "null"
                  description: hard cap EUR per UTC month
                budget_units_day: 
                  type: 
                    - number
                    - "null"
                  description: hard cap billable units per UTC day
              required: 
                - name
      responses: 
        "201": 
          description: Created
        "401": 
          *401
    get: 
      operationId: listKeys
      summary: List own keys
      security: 
        - suiteSession: 
            []
      responses: 
        "200": 
          description: OK
    delete: 
      operationId: revokeKey
      summary: Revoke a key
      security: 
        - suiteSession: 
            []
      parameters: 
        - name: id
          in: query
          required: true
          schema: 
            type: string
            format: uuid
      responses: 
        "200": 
          description: OK
  /api/v1/tools/list_media: 
    post: 
      operationId: list_media
      summary: "List files in the CUT media bin (name, kind, bytes, duration)."
      description: "Required scope: `media:read`. Free."
      security: 
        - bearer: 
            []
      x-scope: media:read
      x-billable: false
      x-gated: false
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/list_catalog: 
    post: 
      operationId: list_catalog
      summary: "List available LUTs, templates, transitions or SFX for use in grade/compose/sfx_mix."
      description: "Required scope: `media:read`. Free."
      security: 
        - bearer: 
            []
      x-scope: media:read
      x-billable: false
      x-gated: false
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                kind: 
                  type: string
                  enum: 
                    - luts
                    - templates
                    - transitions
                    - sfx
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - kind
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/upload_media_from_url: 
    post: 
      operationId: upload_media_from_url
      summary: Fetch a video/image from an https URL into the media bin (max 95 MB; mp4 mov m4v webm jpg png webp heic).
      description: "Required scope: `media:write`. Free."
      security: 
        - bearer: 
            []
      x-scope: media:write
      x-billable: false
      x-gated: false
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                url: 
                  type: string
                  format: uri
                  description: https URL to download
                name: 
                  description: target file name incl. extension
                  type: string
                  pattern: "^[\\w.-]+$"
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - url
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/build_reel: 
    post: 
      operationId: build_reel
      summary: "Auto-reel: transcribe speech and cut silences from one clip, output a vertical reel."
      description: "Required scope: `transcribe`. Billable (pricing.json units, billed only after accept_export / 24 h auto-accept); preview with dry_run=true."
      security: 
        - bearer: 
            []
      x-scope: transcribe
      x-billable: true
      x-gated: true
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                file: 
                  type: string
                  minLength: 1
                  description: Media-bin file name (from list_media or upload_media_from_url)
                output_size: 
                  description: "e.g. \"1080x1920\""
                  type: string
                  pattern: "^\\d{3,4}x\\d{3,4}$"
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - file
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/compose: 
    post: 
      operationId: compose
      summary: "Compose a reel from a template + clips, or from an explicit timeline ({output_size, clips:[{file,in,out,grade?,transition?,effects?}], captions?, sfx?, music?})."
      description: "Required scope: `render`. Billable (pricing.json units, billed only after accept_export / 24 h auto-accept); preview with dry_run=true."
      security: 
        - bearer: 
            []
      x-scope: render
      x-billable: true
      x-gated: true
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                template: 
                  description: product-promo | talking-head-reel | cinematic-trailer
                  type: string
                clips: 
                  description: file names when using a template
                  type: array
                  items: 
                    type: string
                title: 
                  type: string
                output_size: 
                  description: "e.g. \"1080x1920\""
                  type: string
                  pattern: "^\\d{3,4}x\\d{3,4}$"
                timeline: 
                  type: object
                  propertyNames: 
                    type: string
                  additionalProperties: 
                    {}
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/grade: 
    post: 
      operationId: grade
      summary: Colour-grade a clip with a LUT and/or brightness/contrast/saturation/gamma.
      description: "Required scope: `render`. Billable (pricing.json units, billed only after accept_export / 24 h auto-accept); preview with dry_run=true."
      security: 
        - bearer: 
            []
      x-scope: render
      x-billable: true
      x-gated: true
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                file: 
                  type: string
                  minLength: 1
                  description: Media-bin file name (from list_media or upload_media_from_url)
                lut: 
                  type: string
                brightness: 
                  type: number
                contrast: 
                  type: number
                saturation: 
                  type: number
                gamma: 
                  type: number
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - file
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/karaoke: 
    post: 
      operationId: karaoke
      summary: Transcribe and burn word-by-word karaoke captions into the video.
      description: "Required scope: `transcribe`. Billable (pricing.json units, billed only after accept_export / 24 h auto-accept); preview with dry_run=true."
      security: 
        - bearer: 
            []
      x-scope: transcribe
      x-billable: true
      x-gated: true
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                file: 
                  type: string
                  minLength: 1
                  description: Media-bin file name (from list_media or upload_media_from_url)
                font_size: 
                  type: number
                highlight_color: 
                  type: string
                effect: 
                  type: string
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - file
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/reframe: 
    post: 
      operationId: reframe
      summary: Reframe a video to another aspect ratio (e.g. 1080x1920).
      description: "Required scope: `render`. Billable (pricing.json units, billed only after accept_export / 24 h auto-accept); preview with dry_run=true."
      security: 
        - bearer: 
            []
      x-scope: render
      x-billable: true
      x-gated: true
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                file: 
                  type: string
                  minLength: 1
                  description: Media-bin file name (from list_media or upload_media_from_url)
                output_size: 
                  description: "e.g. \"1080x1920\""
                  type: string
                  pattern: "^\\d{3,4}x\\d{3,4}$"
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - file
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/sfx_mix: 
    post: 
      operationId: sfx_mix
      summary: "Mix sound effects into a video: auto (on cuts) or explicit cues [{t, category}]."
      description: "Required scope: `render`. Billable (pricing.json units, billed only after accept_export / 24 h auto-accept); preview with dry_run=true."
      security: 
        - bearer: 
            []
      x-scope: render
      x-billable: true
      x-gated: true
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                file: 
                  type: string
                  minLength: 1
                  description: Media-bin file name (from list_media or upload_media_from_url)
                auto: 
                  type: boolean
                cues: 
                  type: array
                  items: 
                    type: object
                    properties: 
                      t: 
                        type: number
                      category: 
                        type: string
                    required: 
                      - t
                      - category
                    additionalProperties: false
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - file
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/voiceover: 
    post: 
      operationId: voiceover
      summary: Generate a voice-over from text (ElevenLabs) into the media bin.
      description: "Required scope: `voice`. Billable (pricing.json units); preview with dry_run=true."
      security: 
        - bearer: 
            []
      x-scope: voice
      x-billable: true
      x-gated: false
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                text: 
                  type: string
                  minLength: 1
                  maxLength: 5000
                voice_id: 
                  type: string
                model: 
                  type: string
                file: 
                  type: string
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - text
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/export: 
    post: 
      operationId: export
      summary: "Export a timeline JSON to a preset (9:16 1:1 4:5 16:9), thumbnail or gif."
      description: "Required scope: `render`. Billable (pricing.json units, billed only after accept_export / 24 h auto-accept); preview with dry_run=true."
      security: 
        - bearer: 
            []
      x-scope: render
      x-billable: true
      x-gated: true
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                timeline: 
                  type: object
                  propertyNames: 
                    type: string
                  additionalProperties: 
                    {}
                preset: 
                  type: string
                  enum: 
                    - 9:16
                    - 1:1
                    - 4:5
                    - 16:9
                format: 
                  type: string
                  enum: 
                    - thumbnail
                    - gif
                loop: 
                  type: boolean
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - timeline
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/open_in_editor: 
    post: 
      operationId: open_in_editor
      summary: Return the link that opens an agent-built project (inbox id from POST /api/agent/projects) in the CUT editor. The user must be signed in to the DGDH Suite.
      description: "Required scope: `editor`. Free."
      security: 
        - bearer: 
            []
      x-scope: editor
      x-billable: false
      x-gated: false
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                project_id: 
                  type: string
                  format: uuid
                  pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - project_id
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/estimate: 
    post: 
      operationId: estimate
      summary: "Price preview without executing: pass the tool name + its arguments, get billable units and EUR (pricing.json, concept prices) plus your remaining budget. Same as calling any tool with dry_run=true."
      description: "Required scope: `media:read`. Free."
      security: 
        - bearer: 
            []
      x-scope: media:read
      x-billable: false
      x-gated: false
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                tool: 
                  type: string
                args: 
                  type: object
                  propertyNames: 
                    type: string
                  additionalProperties: 
                    {}
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - tool
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/accept_export: 
    post: 
      operationId: accept_export
      summary: "Settle a render: accepted=true confirms and bills it; accepted=false voids it (EUR 0). Renders are billed only when accepted; unresolved renders auto-accept after 24 h. Use usage.event_id from the render result."
      description: "Required scope: `render`. Free."
      security: 
        - bearer: 
            []
      x-scope: render
      x-billable: false
      x-gated: false
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                usage_event_id: 
                  type: string
                  format: uuid
                  pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                accepted: 
                  default: true
                  type: boolean
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              required: 
                - usage_event_id
                - accepted
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/list_projects: 
    post: 
      operationId: list_projects
      summary: "List your server-side agent projects (id, name, duration, revision)."
      description: "Required scope: `editor`. Free."
      security: 
        - bearer: 
            []
      x-scope: editor
      x-billable: false
      x-gated: false
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                dry_run: 
                  description: "true = price preview only, nothing executed or billed"
                  type: boolean
              additionalProperties: false
      responses: 
        "200": 
          description: Tool result
          content: 
            application/json: 
              schema: 
                type: object
                properties: 
                  ok: 
                    type: boolean
                  download_url: 
                    type: string
                additionalProperties: true
        "400": 
          *401
        "401": 
          *401
        "402": 
          *401
        "403": 
          *401
        "422": 
          *401
        "429": 
          *401
  /api/v1/tools/get_project: 
    post: 
      operationId: get_project
      summary: "Summary of an agent project: tracks and elements with ids and times in seconds (use these ids in edit_timeline). full=true returns the raw project JSON."
      description: "Required scope: `editor`. Free."
      security: 
        - bearer: 
